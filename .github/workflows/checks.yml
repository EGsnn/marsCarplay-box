name: Source and offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: python3 code/tools/audit_public.py
      - run: python3 code/tools/build_capabilities.py && git diff --exit-code
      - run: python3 code/tools/check_host.py
